Transform: AWS::Serverless-2016-10-31
Description: TechModa Serverless Capstone - Fashion E-commerce Product Catalog API (base S0)

# ============================================================================
# BASE del capstone (S0): DynamoDB + router CRUD + frontend. Cada sesión de IA
# agrega su recurso pegando el `template-snippet.yaml` correspondiente.
#
# IAM: cada Lambda declara sus `Policies:` y **SAM le crea un rol de mínimo
# privilegio**. No hay rol preexistente ni account ID hardcodeado -> este
# template funciona en cualquier cuenta con permiso de crear roles.
#
# HTTP: una Lambda Function URL (AuthType NONE) + router interno
# (functions/router), en vez de API Gateway.
#
# Deploy: sam build && sam deploy --stack-name techmoda-ai --region us-east-1 \
#           --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
#           --resolve-s3 --no-confirm-changeset
# Detalle: docs/IAM.md
# ============================================================================

Globals:
  Function:
    # Boundary obligatorio: la policy de deploy de los workspaces solo permite
    # iam:CreateRole si el rol nace con este permissions boundary (techo de permisos).
    PermissionsBoundary: arn:aws:iam::281248178297:policy/techmoda-capstone-boundary
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs22.x
    Tracing: Active
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable

Resources:
  # DynamoDB Table
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-Products
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  # ---------------------------------------------------------------------------
  # Router CRUD — una sola Lambda, una sola Function URL (reemplaza API Gateway).
  # CodeUri: functions/  +  Handler: router/index.handler  => el router puede
  # require('../list-items') etc. porque todo functions/ va en el mismo paquete.
  # ---------------------------------------------------------------------------
  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-Router
      Description: Router CRUD de /products via Lambda Function URL
      CodeUri: functions/
      Handler: router/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"

  # ---------------------------------------------------------------------------
  # S1 · Rekognition DetectLabels — auto-etiquetado de fotos de producto.
  # Pegado desde sessions/S01-rekognition-labels/template-snippet.yaml.
  # Patrón: Function URL propia + Policies: propias (SAM le crea el rol).
  # Rekognition se acota por ACCIÓN: las APIs Detect* no admiten ARN de recurso.
  # ---------------------------------------------------------------------------
  EnrichLabelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-EnrichLabels
      Description: S1 - Auto-etiquetado de imagenes de producto (Rekognition DetectLabels)
      CodeUri: sessions/S01-rekognition-labels/functions/enrich-labels
      Handler: app.lambda_handler
      Runtime: python3.12          # override del Runtime global (nodejs22.x)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action: rekognition:DetectLabels
              Resource: "*"
        # Si imageUrl es s3://, Rekognition lee el objeto con ESTE rol.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-*/*
      Environment:
        Variables:
          LABEL_MIN_CONFIDENCE: "80"
          LABEL_MAX_LABELS: "15"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  ModerateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ModerateImage
      Description: S2 - Moderacion de imagen + alt-text accesible (Rekognition)
      CodeUri: sessions/S02-moderation-alttext/functions/moderate-image
      Handler: app.lambda_handler
      Runtime: python3.12          # override del Runtime global (nodejs22.x)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # Dos acciones, no rekognition:*. Este rol puede moderar y etiquetar;
        # el de EnrichLabels (S1) NO puede moderar. Mismo servicio, límites distintos.
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectModerationLabels
                - rekognition:DetectLabels
              Resource: "*"
        # Si imageUrl es s3://, Rekognition lee el objeto con ESTE rol.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-*/*
      Environment:
        Variables:
          # 60, más bajo que el 80 de etiquetado: ante la duda preferimos FLAGGED y
          # revisión humana. Es una decisión de gobernanza, no técnica (D4).
          MODERATION_MIN_CONFIDENCE: "60"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---------------------------------------------------------------------------
  # Frontend estático (S3 + CloudFront).
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-frontend
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub ${FrontendBucket.Arn}/*
            Principal: '*'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: Base API URL (Lambda Function URL del router CRUD). Termina en '/'.
    Value: !GetAtt RouterFunctionUrl.FunctionUrl
  EnrichLabelsUrl:
    Description: S1 Function URL (Rekognition DetectLabels). POST /products/{id}/labels
    Value: !GetAtt EnrichLabelsFunctionUrl.FunctionUrl
  ModerateImageUrl:
    Description: S2 Function URL (moderacion + alt-text). POST /products/{id}/moderate
    Value: !GetAtt ModerateImageFunctionUrl.FunctionUrl
  ProductsTableName:
    Description: Name of the DynamoDB Products table
    Value: !Ref ProductsTable
  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
  FrontendUrl:
    Description: CloudFront URL for the frontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Description: S3 Bucket name for frontend
    Value: !Ref FrontendBucket

Metadata:
  AWS::Composer::Groups:
    Group:
      Label: API Compute
      Members:
        - RouterFunction
