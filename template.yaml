Transform: AWS::Serverless-2016-10-31
Description: TechModa Serverless Capstone - Fashion E-commerce Product Catalog API (base S0)

# ============================================================================
# BASE del capstone (S0): DynamoDB + router CRUD + frontend. Cada sesión de IA
# agrega su recurso pegando el `template-snippet.yaml` correspondiente.
#
# IAM: cada Lambda declara sus `Policies:` y **SAM le crea un rol de mínimo
# privilegio**. No hay rol preexistente ni account ID hardcodeado -> este
# template funciona en cualquier cuenta con permiso de crear roles.
#
# HTTP: una Lambda Function URL (AuthType NONE) + router interno
# (functions/router), en vez de API Gateway.
#
# Deploy: sam build && sam deploy --stack-name techmoda-ai --region us-east-1 \
#           --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
#           --resolve-s3 --no-confirm-changeset
# Detalle: docs/IAM.md
# ============================================================================

Globals:
  Function:
    # Boundary obligatorio: la policy de deploy de los workspaces solo permite
    # iam:CreateRole si el rol nace con este permissions boundary (techo de permisos).
    PermissionsBoundary: arn:aws:iam::281248178297:policy/techmoda-capstone-boundary
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs22.x
    Tracing: Active
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable

Resources:
  # DynamoDB Table
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-Products
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  # ---------------------------------------------------------------------------
  # Router CRUD — una sola Lambda, una sola Function URL (reemplaza API Gateway).
  # CodeUri: functions/  +  Handler: router/index.handler  => el router puede
  # require('../list-items') etc. porque todo functions/ va en el mismo paquete.
  # ---------------------------------------------------------------------------
  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-Router
      Description: Router CRUD de /products via Lambda Function URL
      CodeUri: functions/
      Handler: router/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"

  # ---------------------------------------------------------------------------
  # S1 · Rekognition DetectLabels — auto-etiquetado de fotos de producto.
  # Pegado desde sessions/S01-rekognition-labels/template-snippet.yaml.
  # Patrón: Function URL propia + Policies: propias (SAM le crea el rol).
  # Rekognition se acota por ACCIÓN: las APIs Detect* no admiten ARN de recurso.
  # ---------------------------------------------------------------------------
  EnrichLabelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-EnrichLabels
      Description: S1 - Auto-etiquetado de imagenes de producto (Rekognition DetectLabels)
      CodeUri: sessions/S01-rekognition-labels/functions/enrich-labels
      Handler: app.lambda_handler
      Runtime: python3.12          # override del Runtime global (nodejs22.x)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action: rekognition:DetectLabels
              Resource: "*"
        # Si imageUrl es s3://, Rekognition lee el objeto con ESTE rol.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-*/*
      Environment:
        Variables:
          LABEL_MIN_CONFIDENCE: "80"
          LABEL_MAX_LABELS: "15"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  ModerateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ModerateImage
      Description: S2 - Moderacion de imagen + alt-text accesible (Rekognition)
      CodeUri: sessions/S02-moderation-alttext/functions/moderate-image
      Handler: app.lambda_handler
      Runtime: python3.12          # override del Runtime global (nodejs22.x)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # Dos acciones, no rekognition:*. Este rol puede moderar y etiquetar;
        # el de EnrichLabels (S1) NO puede moderar. Mismo servicio, límites distintos.
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectModerationLabels
                - rekognition:DetectLabels
              Resource: "*"
        # Si imageUrl es s3://, Rekognition lee el objeto con ESTE rol.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-*/*
      Environment:
        Variables:
          # 60, más bajo que el 80 de etiquetado: ante la duda preferimos FLAGGED y
          # revisión humana. Es una decisión de gobernanza, no técnica (D4).
          MODERATION_MIN_CONFIDENCE: "60"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  AnalyzeSentimentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-AnalyzeSentiment
      Description: S3 - Sentimiento de resenas (Amazon Comprehend)
      CodeUri: sessions/S03-comprehend-sentiment/functions/analyze-sentiment
      Handler: app.lambda_handler
      Runtime: python3.12          # override del Runtime global (nodejs22.x)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # DOS acciones: el handler es un pipeline de dos pasos. DetectSentiment
        # exige un LanguageCode explícito, así que primero hay que detectarlo.
        # El snippet original sólo traía DetectSentiment y la primera llamada moría
        # con AccessDeniedException — mínimo privilegio funcionando como se espera.
        - Statement:
            - Effect: Allow
              Action:
                - comprehend:DetectDominantLanguage
                - comprehend:DetectSentiment
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  TranslateCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-TranslateCatalog
      Description: S4 - Catalogo multilingue ES/EN (Amazon Translate)
      CodeUri: sessions/S04-translate-multilang/functions/translate-catalog
      Handler: app.lambda_handler
      Runtime: python3.12          # override del Runtime global (nodejs22.x)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # DOS acciones, y la segunda no es obvia: el handler usa
        # SourceLanguageCode="auto", y con "auto" Translate llama a Comprehend
        # POR DENTRO usando ESTE rol. Sin el permiso, TranslateText falla con
        # DownstreamDependencyAccessDeniedException — verificado desplegando el
        # snippet tal como venía. Es composición de servicios visible en IAM.
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
                - comprehend:DetectDominantLanguage
              Resource: "*"
      Environment:
        Variables:
          # Idioma en el que está autorado el catálogo: fallback cuando la detección
          # automática no alcanza el umbral. Medido: "Vestido midi floral" se detecta
          # como PORTUGUES con 0.45-0.51, y los aciertos dan 0.79-0.98.
          CATALOG_SOURCE_LANG: "es"
          MIN_LANG_CONFIDENCE: "0.60"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---------------------------------------------------------------------------
  # S5 · Amazon Polly + bucket de audio  —  pegar en template.yaml
  # ---------------------------------------------------------------------------
  # Agrega 1 bucket S3 (audio) y 1 Lambda con Function URL propia. La función declara
  # sus `Policies:` y SAM le crea un rol de mínimo privilegio. Ver docs/IAM.md.

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-audio
      # Sin acceso público: el audio se sirve por URL prefirmada (mejor práctica).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAudio
            Status: Enabled
            ExpirationInDays: 7   # FinOps: el audio de demo no se acumula

  SynthesizeVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SynthesizeVoice
      Description: S5 - Descripcion por voz / accesibilidad (Amazon Polly)
      CodeUri: sessions/S05-polly-voice/functions/synthesize-voice
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
        # Escribe el mp3 y firma la URL prefirmada con este rol -> Crud.
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Environment:
        Variables:
          AUDIO_BUCKET: !Ref AudioBucket
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---------------------------------------------------------------------------
  # S6 · Amazon Bedrock (generacion)  —  pegar en template.yaml
  # ---------------------------------------------------------------------------
  # Patrón: Function URL propia (sin API Gateway) + `Policies:` de mínimo privilegio
  # (SAM crea el rol). Ver docs/IAM.md.
  # Ver docs/SANDBOX-COMPAT.md.

  GenerateDescriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-GenerateDescription
      Description: S6 - Generar descripciones de producto (Bedrock / GenAI)
      CodeUri: sessions/S06-bedrock-descripciones/functions/generate-description
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # Bedrock SI admite ARN de recurso -> acotamos al modelo, no a bedrock:*.
        # inference-profile cubre los IDs con prefijo "us." (perfiles cross-region).
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
        # S9: ApplyGuardrail para proteger las salidas generativas. Es una acción
        # SEPARADA de InvokeModel: un rol que puede invocar el modelo pero no aplicar el
        # guardrail falla recién cuando el handler pasa guardrailConfig — o sea, la
        # llamada sin protección sigue andando y el error aparece al activar la defensa.
        #
        # El guardrail se quedó en el tier CLASSIC a propósito. STANDARD (definiciones
        # largas + mejor multilingüe) exige inferencia cross-region, y entonces la
        # autorización pasa también por el ARN guardrail-PROFILE — el mismo patrón que
        # foundation-model / inference-profile de arriba. Ese ARN no se puede conceder
        # acá: `techmoda-capstone-boundary` no lo permite, y el boundary es el techo. Con
        # STANDARD la Lambda muere con AccessDeniedException sobre
        # guardrail-profile/us.guardrail.v1:0. Ver TROUBLESHOOTING #15.
        - Statement:
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:guardrail/*
      Timeout: 60   # los modelos generativos pueden tardar varios segundos
      Environment:
        Variables:
          # Usa inference profile (prefijo "us.") en lugar de foundation-model directo.
          # on-demand throughput no se soporta para foundation models; hay que usar un
          # profile que provisione capacidad compartida. Detalle: docs/IAM.md.
          BEDROCK_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
          BEDROCK_MAX_TOKENS: "300"
          BEDROCK_TEMPERATURE: "0.7"
          BEDROCK_GUARDRAIL_ID: "0lk4bxdujw2r"
          # Versión 9: DOS temas denegados enfocados (financiero/legal + médico). La 6 tenía
          # uno solo que los mezclaba y bloqueaba 1 de 5 paráfrasis; separarlos y enumerar
          # sustantivos concretos en la definition lo llevó a 7 de 8, sin falsos positivos.
          # Medido en evidence/S09-guardrails-sesgo/08-…; detalle en TROUBLESHOOTING #15.
          # Apuntá SIEMPRE a una versión publicada, nunca a DRAFT: DRAFT cambia bajo los
          # pies de la Lambda y la evidencia deja de ser reproducible.
          BEDROCK_GUARDRAIL_VERSION: "9"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---------------------------------------------------------------------------
  # S7 · Bedrock embeddings (busqueda semantica / RAG)  —  pegar en template.yaml
  # ---------------------------------------------------------------------------
  # Dos Lambdas: indexador (escribe embeddings) y buscador (lee y rankea).
  # Cada una con su Function URL y sus `Policies:` de mínimo privilegio (SAM crea
  # el rol). semantic-search solo lee DynamoDB; index-embeddings escribe. Ver docs/IAM.md.

  IndexEmbeddingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-IndexEmbeddings
      Description: S7 - Construye el indice de embeddings del catalogo (Bedrock Titan)
      CodeUri: sessions/S07-bedrock-rag-busqueda/functions/index-embeddings
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # Bedrock SI admite ARN de recurso -> acotamos al modelo, no a bedrock:*.
        # inference-profile cubre los IDs con prefijo "us." (perfiles cross-region).
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
      Timeout: 120   # recorre todo el catalogo
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  SemanticSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SemanticSearch
      Description: S7 - Busqueda semantica del catalogo (Bedrock Titan)
      CodeUri: sessions/S07-bedrock-rag-busqueda/functions/semantic-search
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
        # Bedrock SI admite ARN de recurso -> acotamos al modelo, no a bedrock:*.
        # inference-profile cubre los IDs con prefijo "us." (perfiles cross-region).
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
      Timeout: 60
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          SEARCH_TOP_K: "5"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---------------------------------------------------------------------------
  # S8 · Bedrock chatbot RAG (asistente de compras)  —  pegar en template.yaml
  # ---------------------------------------------------------------------------
  # Reusa los embeddings de S7. Necesita InvokeModel sobre DOS modelos:
  # el de embeddings (retrieval) y el de generacion (chat).
  # Patrón: Function URL propia (sin API Gateway) + `Policies:` de mínimo privilegio
  # (SAM crea el rol). Ver docs/IAM.md.

  ShoppingAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ShoppingAssistant
      Description: S8 - Asistente de compras conversacional (Bedrock RAG)
      CodeUri: sessions/S08-bedrock-chatbot/functions/shopping-assistant
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
        # Bedrock SI admite ARN de recurso -> acotamos al modelo, no a bedrock:*.
        # inference-profile cubre los IDs con prefijo "us." (perfiles cross-region).
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
        # S9: ApplyGuardrail para proteger las salidas generativas. Es una acción
        # SEPARADA de InvokeModel: un rol que puede invocar el modelo pero no aplicar el
        # guardrail falla recién cuando el handler pasa guardrailConfig — o sea, la
        # llamada sin protección sigue andando y el error aparece al activar la defensa.
        #
        # El guardrail se quedó en el tier CLASSIC a propósito. STANDARD (definiciones
        # largas + mejor multilingüe) exige inferencia cross-region, y entonces la
        # autorización pasa también por el ARN guardrail-PROFILE — el mismo patrón que
        # foundation-model / inference-profile de arriba. Ese ARN no se puede conceder
        # acá: `techmoda-capstone-boundary` no lo permite, y el boundary es el techo. Con
        # STANDARD la Lambda muere con AccessDeniedException sobre
        # guardrail-profile/us.guardrail.v1:0. Ver TROUBLESHOOTING #15.
        - Statement:
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:guardrail/*
      Timeout: 60
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          BEDROCK_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
          ASSISTANT_TOP_K: "3"
          BEDROCK_MAX_TOKENS: "400"
          BEDROCK_GUARDRAIL_ID: "0lk4bxdujw2r"
          # Versión 9: DOS temas denegados enfocados (financiero/legal + médico). La 6 tenía
          # uno solo que los mezclaba y bloqueaba 1 de 5 paráfrasis; separarlos y enumerar
          # sustantivos concretos en la definition lo llevó a 7 de 8, sin falsos positivos.
          # Medido en evidence/S09-guardrails-sesgo/08-…; detalle en TROUBLESHOOTING #15.
          # Apuntá SIEMPRE a una versión publicada, nunca a DRAFT: DRAFT cambia bajo los
          # pies de la Lambda y la evidencia deja de ser reproducible.
          BEDROCK_GUARDRAIL_VERSION: "9"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---------------------------------------------------------------------------
  # Frontend estático (S3 + CloudFront).
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-frontend
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub ${FrontendBucket.Arn}/*
            Principal: '*'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: Base API URL (Lambda Function URL del router CRUD). Termina en '/'.
    Value: !GetAtt RouterFunctionUrl.FunctionUrl
  EnrichLabelsUrl:
    Description: S1 Function URL (Rekognition DetectLabels). POST /products/{id}/labels
    Value: !GetAtt EnrichLabelsFunctionUrl.FunctionUrl
  ModerateImageUrl:
    Description: S2 Function URL (moderacion + alt-text). POST /products/{id}/moderate
    Value: !GetAtt ModerateImageFunctionUrl.FunctionUrl
  AnalyzeSentimentUrl:
    Description: S3 Function URL (Comprehend). POST /sentiment con {"text"} o {"reviews","productId"}
    Value: !GetAtt AnalyzeSentimentFunctionUrl.FunctionUrl
  TranslateCatalogUrl:
    Description: S4 Function URL (Amazon Translate). POST /products/{id}/translate {"target":"en"}
    Value: !GetAtt TranslateCatalogFunctionUrl.FunctionUrl
  SynthesizeVoiceUrl:
    Description: S5 Function URL (Amazon Polly). POST /products/{id}/voice {"lang":"es"}
    Value: !GetAtt SynthesizeVoiceFunctionUrl.FunctionUrl
  AudioBucketName:
    Description: S3 Bucket name for audio (presigned URLs, 1-hour expiry)
    Value: !Ref AudioBucket
  GenerateDescriptionUrl:
    Description: S6 Function URL (Bedrock / Claude). POST /products/{id}/describe {"tone":"elegante","save":true}
    Value: !GetAtt GenerateDescriptionFunctionUrl.FunctionUrl
  IndexEmbeddingsUrl:
    Description: S7 Function URL (indexador). POST /search/index
    Value: !GetAtt IndexEmbeddingsFunctionUrl.FunctionUrl
  SemanticSearchUrl:
    Description: S7 Function URL (búsqueda). GET /search?q=...
    Value: !GetAtt SemanticSearchFunctionUrl.FunctionUrl
  ShoppingAssistantUrl:
    Description: S8 Function URL (chatbot RAG). POST /assistant {"message":"..."}
    Value: !GetAtt ShoppingAssistantFunctionUrl.FunctionUrl
  ProductsTableName:
    Description: Name of the DynamoDB Products table
    Value: !Ref ProductsTable
  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
  FrontendUrl:
    Description: CloudFront URL for the frontend
    # ⚠️ WORKAROUND DE ENTORNO (2026-09-09) — la forma correcta es la comentada:
    #   Value: !Sub 'https://${FrontendDistribution.DomainName}'
    # El boundary `bootcamp-workspace-boundary` del rol del workspace dejó de permitir
    # `cloudfront:GetDistribution`. CloudFormation resuelve los Outputs con NUESTRA
    # identidad, así que ese !GetAtt hace fallar TODO `sam deploy` posterior — no en un
    # recurso, sino al armar los Outputs, y el stack entero termina en
    # UPDATE_ROLLBACK_COMPLETE revirtiendo cambios que ya se habían aplicado bien.
    # El dominio de una distribución es fijo mientras la distribución exista, así que
    # fijarlo desbloquea el deploy sin cambiar nada de la infraestructura.
    # Restaurá el !GetAtt en cuanto el boundary vuelva a permitir la acción; en una
    # cuenta sin esa restricción esta línea hay que cambiarla por el dominio propio.
    # Detalle completo: docs/TROUBLESHOOTING.md.
    Value: 'https://d42fthdjmstgj.cloudfront.net'
  FrontendBucketName:
    Description: S3 Bucket name for frontend
    Value: !Ref FrontendBucket

Metadata:
  AWS::Composer::Groups:
    Group:
      Label: API Compute
      Members:
        - RouterFunction
